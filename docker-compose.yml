services:
  postgres:
    image: postgres:16-alpine
    container_name: holodori-gacha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-holodori_gacha}
      POSTGRES_USER: ${POSTGRES_USER:-holodori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - holodori_gacha_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-holodori} -d ${POSTGRES_DB:-holodori_gacha}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  holodori_gacha_postgres:
